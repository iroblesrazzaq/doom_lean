name: ci

on:
  push:
  pull_request:

jobs:
  playsim:
    name: playsim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test tools
        run: bash tools/tests/run_tests.sh
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Playsim gate
        run: |
          set -euo pipefail
          if [[ -f "${HOME}/.elan/env" ]]; then
            # shellcheck disable=SC1091
            source "${HOME}/.elan/env"
          fi
          ROOT="$(pwd)"
          if [[ -n "${RUNNER_TEMP:-}" ]]; then
            OUT="${RUNNER_TEMP}/playsim_cand"
          else
            OUT="${ROOT}/.agent_tmp/ci_playsim"
          fi
          mkdir -p "${OUT}/demo1" "${OUT}/demo2" "${OUT}/demo3"

          generate() {
            local demo="$1" tics="$2" ref_dig="$3" ref_trc="$4" dest="$5"
            (cd "${ROOT}/lean" && lake exe verify -- \
              --iwad "${ROOT}/fixtures/wads/doom1.wad" \
              --impl real \
              --root "${ROOT}" \
              --out-dir "${dest}" \
              --demo "${demo}" \
              --tics "${tics}" \
              --ref-digest "${ref_dig}" \
              --ref-trace "${ref_trc}")
            if [[ ! -f "${dest}/candidate.dig" || ! -f "${dest}/candidate.trc" ]]; then
              echo "GATE FAIL: playsim (missing cand after generate in ${dest})"
              exit 1
            fi
            REF_DIG="${ref_dig}" CAND_DIG="${dest}/candidate.dig" \
              REF_TRC="${ref_trc}" CAND_TRC="${dest}/candidate.trc" \
              bash "${ROOT}/tools/ci/gate_playsim.sh"
          }

          generate DEMO1 5026 \
            "${ROOT}/fixtures/demo1.dig" "${ROOT}/fixtures/demo1.trc" \
            "${OUT}/demo1"
          generate DEMO2 3836 \
            "${ROOT}/fixtures/demo2.dig" "${ROOT}/fixtures/demo2.trc" \
            "${OUT}/demo2"
          generate DEMO3 2134 \
            "${ROOT}/fixtures/holdout/demo3.dig" "${ROOT}/fixtures/holdout/demo3.trc" \
            "${OUT}/demo3"

  renderer:
    name: renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Renderer gate
        run: |
          set -euo pipefail
          if [[ -f "${HOME}/.elan/env" ]]; then
            # shellcheck disable=SC1091
            source "${HOME}/.elan/env"
          fi
          ROOT="$(pwd)"
          (cd lean && lake exe fb-test)
          CAND="${ROOT}/.agent_tmp/fb_cand"
          if [[ ! -d "${CAND}" ]] || ! ls "${CAND}"/fb_*.ppm >/dev/null 2>&1; then
            echo "GATE FAIL: renderer (missing cand in ${CAND})"
            exit 1
          fi
          bash tools/ci/gate_renderer.sh fixtures/fb/demo1 .agent_tmp/fb_cand

  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static gate
        run: bash tools/ci/gate_static.sh

  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Perf gate
        run: |
          set -euo pipefail
          if [[ -f "${HOME}/.elan/env" ]]; then
            # shellcheck disable=SC1091
            source "${HOME}/.elan/env"
          fi
          bash tools/ci/gate_perf.sh bash lean/bench_playsim.sh

  protected:
    name: protected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protected-paths gate
        run: |
          set -euo pipefail
          # On PRs, compare against the base branch; on push to default, the
          # gate is informational about tools/fixtures drift vs origin/main.
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch origin "$GITHUB_BASE_REF" --depth=1
            export BASE_REF="origin/$GITHUB_BASE_REF"
          else
            export BASE_REF="${BASE_REF:-origin/main}"
            if git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
              :
            elif git fetch origin main --depth=1; then
              :
            else
              echo "SKIP: protected gate — cannot resolve BASE_REF=$BASE_REF yet (milestone 0)"
              exit 0
            fi
          fi
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            echo "SKIP: protected gate — BASE_REF=$BASE_REF not available yet"
            exit 0
          fi
          bash tools/ci/gate_protected.sh
